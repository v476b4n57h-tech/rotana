# Automatic checks on every push and pull request:
# code quality, types, formatting, unit tests, build, browser and visual tests.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      # Pixel comparison with the original index.html (fonts load from Google Fonts like the original).
      - run: npm run test:visual
        env:
          CI: "true"
      - name: Upload comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-comparison
          path: test-results/visual
          retention-days: 14
